# Basic NGINX server configuration for PHP application
server {
    # Listen on port 81 for local development
    listen 81;
    server_name localhost;
    
    # Set the root directory to the public folder (Laravel/Symfony standard)
    root /var/www/public;

    # Define the order of index files to try
    index index.php index.html;

    # CRITICAL: Allow large file uploads (2GB limit)
    client_max_body_size 2048M;
    client_body_buffer_size 128k;
    client_body_timeout 3600s;

    # Main location block for handling requests
    location / {
        # Try to serve the requested URI, fall back to index.php with query string
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files handler
    location ~ \.php$ {
        # Include standard FastCGI parameters
        include fastcgi_params;
        
        # Pass PHP requests to the PHP-FPM container named 'app' on port 9000
        fastcgi_pass app:9000;
        
        # Set the default index file for directory requests
        fastcgi_index index.php;
        
        # Set the SCRIPT_FILENAME parameter required by PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Increase timeouts for large file uploads
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
    }

    # Block access to hidden files (like .htaccess)
    location ~ /\.ht {
        deny all;
    }
}